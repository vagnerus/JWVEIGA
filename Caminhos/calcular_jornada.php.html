<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Plantão</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0f172a;
  color: #e5e7eb;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.container {
  width: 420px;
  background: #020617;
  padding: 30px;
  border-radius: 14px;
  box-shadow: 0 0 30px rgba(0,0,0,0.7);
  text-align: center;
}

h1 {
  margin-bottom: 25px;
  color: #38bdf8;
}

.grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 18px;
}

.label {
  font-weight: bold;
  font-size: 15px;
  color: #94a3b8;
}

.value {
  font-size: 22px;
  font-weight: bold;
  color: #f8fafc;
}

#b3 {
  color: #22c55e;
}

#c3 {
  color: #ef4444;
}

input {
  width: 100%;
  font-size: 26px;
  padding: 12px;
  text-align: center;
  border-radius: 8px;
  border: none;
  outline: none;
  background: #020617;
  color: #38bdf8;
  box-shadow: inset 0 0 0 1px #1e293b;
}

.icon-check {
  color: #22c55e;
  margin-left: 8px;
}

.icon-close {
  color: #ef4444;
  margin-left: 8px;
}
</style>
</head>

<body>

<div class="container">
  <h1>Plantão</h1>

  <div class="grid">
    <div class="label">Hora de entrada</div>
    <input type="text" id="entrada" placeholder="HH:MM" maxlength="5">

    <div class="label">Janela de Intervalo</div>
    <div class="value">
      <span id="b3">--:--</span>
      <span class="icon-check">✔</span>
    </div>

    <div class="label">Fim da Janela</div>
    <div class="value">
      <span id="c3">--:--</span>
      <span class="icon-close">❌</span>
    </div>

    <div class="label">Hora da saída</div>
    <div class="value" id="d3">--:--</div>
  </div>
</div>

<script>
const entrada = document.getElementById("entrada");
const b3 = document.getElementById("b3");
const c3 = document.getElementById("c3");
const d3 = document.getElementById("d3");

function addMinutes(time, mins) {
  let [h, m] = time.split(":").map(Number);
  let d = new Date();
  d.setHours(h, m + mins, 0, 0);
  return d.toTimeString().slice(0,5);
}

function calcular(hora) {
  const inicioIntervalo = addMinutes(hora, 150); // 2h30
  const fimIntervalo = addMinutes(hora, 330);    // 5h30
  const saida = addMinutes(hora, 500);           // 8h20

  b3.innerText = inicioIntervalo;
  c3.innerText = fimIntervalo;
  d3.innerText = saida;
}

function limparTudo() {
  entrada.value = "";
  b3.innerText = "--:--";
  c3.innerText = "--:--";
  d3.innerText = "--:--";
  entrada.focus();
}

entrada.addEventListener("input", () => {
  let v = entrada.value.replace(/\D/g, "");

  if (v.length >= 3) {
    v = v.substring(0,2) + ":" + v.substring(2,4);
  }

  entrada.value = v;

  if (v.length === 5) {
    let [h, m] = v.split(":").map(Number);
    if (h <= 23 && m <= 59) {
      calcular(v);
    }
  }
});

entrada.addEventListener("keydown", e => {
  if (e.key === "Enter") {
    e.preventDefault();
    limparTudo();
  }
});

window.onload = () => entrada.focus();
</script>

</body>
</html>
